<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCP-173 清掃管理</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#ddd;font-family:Arial,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;overflow:hidden}
#game{height:100vh;display:flex;flex-direction:column}
header{height:62px;background:#202020;border-bottom:2px solid #444;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
header h1{font-size:20px;margin:0;color:#eee}
.stats{display:flex;gap:18px;font-size:14px}
.stat b{color:#fff}
#danger{color:#ff7777}
main{flex:1;display:flex;min-height:0}
#facility{position:relative;flex:1;background:#191919;overflow:hidden}
#room{position:absolute;left:5%;right:5%;top:7%;bottom:8%;border:5px solid #555;background:
linear-gradient(90deg,transparent 49.5%,#333 49.5%,#333 50.5%,transparent 50.5%),
linear-gradient(transparent 49.5%,#333 49.5%,#333 50.5%,transparent 50.5%),
#252525;
box-shadow:inset 0 0 50px #000}
.walllabel{position:absolute;color:#777;font-size:12px;pointer-events:none}
#entity{position:absolute;width:54px;height:82px;background:#aaa;border:3px solid #666;box-shadow:0 0 12px #000;transform:translate(-50%,-50%);z-index:5;transition:left .25s linear,top .25s linear}
#entity:before{content:"";position:absolute;width:30px;height:20px;background:#aaa;border-radius:50%;left:9px;top:-10px;border:3px solid #666}
#entity:after{content:"173";position:absolute;left:9px;top:28px;color:#222;font-weight:bold;font-size:12px}
#entity.moving{animation:shake .22s infinite alternate}
@keyframes shake{from{transform:translate(-50%,-50%) rotate(-2deg)}to{transform:translate(-50%,-50%) rotate(2deg)}}
.dirt{position:absolute;width:38px;height:24px;border-radius:45% 55% 50% 40%;background:rgba(93,38,32,.85);box-shadow:0 0 7px rgba(80,20,15,.8);z-index:2;pointer-events:none}
.dirt:after{content:"";position:absolute;width:8px;height:5px;background:#52241f;border-radius:50%;right:-3px;bottom:2px}
#controls{width:315px;background:#202020;border-left:2px solid #444;padding:16px;overflow:auto}
#controls h2{font-size:17px;margin:0 0 12px}
button{width:100%;padding:12px;margin:6px 0;background:#383838;border:1px solid #666;color:#eee;border-radius:4px;cursor:pointer;font-size:14px}
button:hover{background:#4a4a4a}
button:disabled{opacity:.4;cursor:not-allowed}
#message{min-height:54px;background:#151515;border:1px solid #444;padding:9px;font-size:13px;line-height:1.45;margin:10px 0}
.bar{height:20px;background:#111;border:1px solid #555;border-radius:3px;overflow:hidden;margin:5px 0 12px}
.fill{height:100%;width:0%;transition:width .2s;background:#b84b42}
#log{font-size:12px;background:#151515;border:1px solid #444;height:180px;overflow:auto;padding:8px;line-height:1.5}
.logline{margin-bottom:4px;color:#aaa}
.logline.alert{color:#ff7777}
#gameover{position:absolute;inset:0;background:rgba(0,0,0,.9);z-index:20;display:none;align-items:center;justify-content:center;text-align:center}
#gameover .box{border:2px solid #9b2d2d;padding:35px;background:#171717;max-width:520px}
#gameover h2{font-size:32px;color:#e05252;margin-top:0}
.small{font-size:11px;color:#888}
@media(max-width:800px){
  main{flex-direction:column}
  #facility{height:62%;flex:none}
  #controls{width:100%;height:38%;border-left:0;border-top:2px solid #444}
  #log{height:90px}
  #room{left:3%;right:3%;top:5%;bottom:5%}
}
</style>
</head>
<body>
<div id="game">
<header>
  <h1>SCP-173 ― 収容室衛生管理</h1>
  <div class="stats">
    <span>経過時間: <b id="time">00:00</b></span>
    <span>汚染度: <b id="danger">0%</b></span>
  </div>
</header>
<main>
  <section id="facility">
    <div id="room">
      <div class="walllabel" style="left:8px;top:8px">CONTAINMENT CHAMBER</div>
      <div class="walllabel" style="right:8px;bottom:8px">D-173 / CLEANING ZONE</div>
      <div id="entity" title="SCP-173"> </div>
    </div>
    <div id="gameover">
      <div class="box">
        <h2>収容違反</h2>
        <p>SCP-173周辺の混合物が危険限界を超えました。</p>
        <p>収容プロトコルが破綻し、ゲームオーバーです。</p>
        <button onclick="location.reload()">もう一度プレイ</button>
      </div>
    </div>
  </section>
  <aside id="controls">
    <h2>施設管理</h2>
    <div id="message">監視員: SCP-173は現在、収容室内を徘徊しています。汚染が増える前にDクラスを派遣してください。</div>

    <div>収容状態</div>
    <div class="bar"><div id="containFill" class="fill"></div></div>

    <button id="sendBtn" onclick="sendDClass()">Dクラス職員を派遣</button>
    <button onclick="cleanEmergency()">緊急清掃を指示</button>

    <p class="small">Dクラスは一度に1名だけ派遣できます。清掃には数秒かかります。</p>
    <h2>監視ログ</h2>
    <div id="log"></div>
  </aside>
</main>
</div>

<script>
const room=document.getElementById("room");
const entity=document.getElementById("entity");
const dangerEl=document.getElementById("danger");
const fill=document.getElementById("containFill");
const timeEl=document.getElementById("time");
const msg=document.getElementById("message");
const logEl=document.getElementById("log");
const sendBtn=document.getElementById("sendBtn");

let danger=0, seconds=0, gameOver=false, cleaning=false, dirtCount=0;
let x=50,y=50;

function log(t,alert=false){
  const d=document.createElement("div");
  d.className="logline"+(alert?" alert":"");
  d.textContent="["+timeEl.textContent+"] "+t;
  logEl.prepend(d);
  while(logEl.children.length>35) logEl.lastChild.remove();
}
function updateDanger(){
  danger=Math.max(0,Math.min(100,danger));
  dangerEl.textContent=Math.floor(danger)+"%";
  fill.style.width=danger+"%";
  if(danger>=75){dangerEl.style.color="#ff3b30";fill.style.background="#b62d2d"}
  else if(danger>=50){dangerEl.style.color="#ff9f43";fill.style.background="#b86a32"}
  else {dangerEl.style.color="#ff7777";fill.style.background="#b84b42"}
  if(danger>=100 && !gameOver) endGame();
}
function move173(){
  if(gameOver)return;
  x=12+Math.random()*76;
  y=14+Math.random()*72;
  entity.style.left=x+"%";
  entity.style.top=y+"%";
  entity.classList.add("moving");
  setTimeout(()=>entity.classList.remove("moving"),260);
}
function makeDirt(){
  if(gameOver)return;
  const d=document.createElement("div");
  d.className="dirt";
  d.style.left=(x+(Math.random()*10-5))+"%";
  d.style.top=(y+(Math.random()*10-5))+"%";
  d.style.transform="rotate("+Math.random()*180+"deg) scale("+(0.7+Math.random()*1.1)+")";
  room.appendChild(d);
  dirtCount++;
  danger+=2.2+Math.random()*2.2;
  updateDanger();
  if(danger>=70) log("警告: 混合物がかなり蓄積しています。",true);
}
function sendDClass(){
  if(gameOver||cleaning)return;
  cleaning=true;
  sendBtn.disabled=true;
  msg.textContent="監視員: Dクラス職員が収容室へ入りました。清掃を開始しています。";
  log("Dクラス職員を収容室へ派遣。");
  setTimeout(()=>{
    if(gameOver)return;
    cleaning=false;
    sendBtn.disabled=false;
    const reduction=Math.min(danger,18+Math.random()*12);
    danger-=reduction;
    const dirt=document.querySelectorAll(".dirt");
    const remove=Math.ceil(dirt.length*0.55);
    for(let i=0;i<remove;i++) if(dirt[i]) dirt[i].remove();
    updateDanger();
    msg.textContent="監視員: Dクラスによる清掃が完了しました。";
    log("清掃完了。汚染度を約"+Math.floor(reduction)+"%分除去。");
  },3500);
}
function cleanEmergency(){
  if(gameOver)return;
  const reduction=Math.min(danger,8);
  danger-=reduction;
  updateDanger();
  msg.textContent="監視員: 緊急清掃班が通路側から処理しました。";
  log("緊急清掃を実施。効果は限定的。");
}
function endGame(){
  gameOver=true;
  entity.style.display="none";
  document.getElementById("gameover").style.display="flex";
  msg.textContent="警報: SCP-173の収容に失敗しました。";
  log("SCP-173収容違反。ゲームオーバー。",true);
}
setInterval(()=>{
  if(gameOver)return;
  seconds++;
  const m=String(Math.floor(seconds/60)).padStart(2,"0");
  const s=String(seconds%60).padStart(2,"0");
  timeEl.textContent=m+":"+s;
},1000);
setInterval(()=>{
  if(gameOver)return;
  move173();
},1800);
setInterval(()=>{
  if(gameOver)return;
  makeDirt();
},2600);

entity.style.left=x+"%";
entity.style.top=y+"%";
log("SCP-173収容室の監視を開始。");
log("清掃要員待機中。");
</script>
</body>
</html>
